[project]
name = "chat-with-document"
version = "0.1.0"
description = "Local Chat with Document with grounded answers and Context Budget Trace"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2", "tiktoken>=0.9,<1", "numpy>=2,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_document"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/integration"]
addopts = "-m 'not eval'"
markers = ["eval: opt-in live LLM evaluation (requires local Ollama and cloud access)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
